<div class="container mt-5">
  <div class="card shadow-lg p-4">
    <h2 class="text-center mb-4">{{ id ? 'Modifier Promotion' : 'Ajouter Promotion' }}</h2>

    <form (ngSubmit)="savePromotion()" #promotionForm="ngForm">
      <div class="mb-3">
        <label for="nom" class="form-label">Nom</label>
        <input type="text" id="nom" name="nom" class="form-control" [(ngModel)]="promotion.nom" required>
      </div>

      <div class="mb-3">
        <label for="pourcentage" class="form-label">Pourcentage (%)</label>
        <input type="number" id="pourcentage" name="pourcentage" class="form-control" [(ngModel)]="promotion.pourcentage" required min="0" max="100">
      </div>

      <div class="mb-3">
        <label for="dateFin" class="form-label">Date de Fin</label>
        <input type="date" id="dateFin" name="dateFin" class="form-control" [(ngModel)]="promotion.dateFin" required>
      </div>

      <div class="text-center">
        <button type="submit" class="btn btn-success w-50">{{ id ? 'Modifier' : 'Ajouter' }}</button>
      </div>
    </form>
  </div>
</div>
