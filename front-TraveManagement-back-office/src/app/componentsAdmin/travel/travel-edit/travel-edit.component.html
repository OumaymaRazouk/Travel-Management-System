<div class="container mt-4">
  <h2>Modifier Voyage ✈️</h2>

  <form (ngSubmit)="updateTravel()">
    <!-- Champ destination -->
    <input type="text" [(ngModel)]="travel.destination" name="destination" placeholder="Destination" required class="form-control mb-2">

    <!-- Champ date départ -->
    <input type="date" [(ngModel)]="travel.dateDepart" name="dateDepart" required class="form-control mb-2">

    <!-- Champ date retour -->
    <input type="date" [(ngModel)]="travel.dateRetour" name="dateRetour" required class="form-control mb-2">

    <!-- Champ prix -->
    <input type="number" [(ngModel)]="travel.prix" name="prix" placeholder="Prix" required class="form-control mb-2">

    <!-- Champ nombre de places -->
    <input type="number" [(ngModel)]="travel.nombrePlaces" name="nombrePlaces" placeholder="Places" required class="form-control mb-2">

    <!-- Champ description -->
    <textarea [(ngModel)]="travel.description" name="description" placeholder="Description" required class="form-control mb-2" rows="4"></textarea>

    <!-- Champ fichier pour image -->
    <input type="file" (change)="onFileSelected($event)" class="form-control mb-2">

    <!-- Affichage de l'image si elle est sélectionnée -->
    <img *ngIf="travel.imageUrl" [src]="travel.imageUrl" alt="Aperçu image" style="width: 200px; height: auto;" />


    <!-- Message d'erreur -->
    <div *ngIf="errorMessage" class="alert alert-danger mt-2">
      {{ errorMessage }}
    </div>

    <!-- Bouton de soumission -->
    <button type="submit" class="btn btn-primary mt-3">Mettre à jour</button>
  </form>
</div>
