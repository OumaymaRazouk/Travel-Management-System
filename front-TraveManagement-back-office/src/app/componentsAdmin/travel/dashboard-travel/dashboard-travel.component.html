<!-- Keep the existing navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" routerLink="/dashboard-travel">Gestion de Voyage</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link" routerLink="/dashboard-travel" routerLinkActive="active">Liste Voyages</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/promotion-list" routerLinkActive="active">Liste Promotions</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/home" routerLinkActive="active">Home</a>
        </li>
        <li class="nav-item">
          <a class="btn btn-outline-light ms-2" routerLink="/login">Login</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- Dashboard Content -->
<div class="container mt-4 animate-fade-in">
  <div class="row mb-4 align-items-center">
    <div class="col-md-6">
      <h2 class="text-primary">
        <i class="bi bi-airplane"></i> Dashboard des Voyages
      </h2>
    </div>
    <div class="col-md-6 text-end">
      <a routerLink="/travels/add" class="btn btn-primary">
        <i class="bi bi-plus-circle"></i> Ajouter un voyage
      </a>
    </div>
  </div>

  <!-- Travel Cards Grid -->
  <div class="row g-4">
    <div class="col-md-6 col-lg-4" *ngFor="let travel of travels">
      <div class="card h-100 border-0 rounded-3 shadow-sm card-hover">
        <!-- Image with hover effect -->
        <div class="travel-image-container">
          <img
            *ngIf="travel.imageUrl"
            [src]=" travel.imageUrl"
            class="card-img-top travel-image"
            alt="{{travel.destination}}"
            (click)="navigateToDetail(travel.idVoyage)"
          />
          <div
            *ngIf="!travel.imageUrl"
            class="card-img-top travel-placeholder"
            (click)="navigateToDetail(travel.idVoyage)">
            <div class="text-center py-5">
              <i class="bi bi-image fs-1"></i>
              <p>Aucune image disponible</p>
            </div>
          </div>
          <div class="image-overlay" (click)="navigateToDetail(travel.idVoyage)">
            <span></span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
