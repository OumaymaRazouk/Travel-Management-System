<div class="container mt-4">
  <h2>Ajouter un Voyage ✈️</h2>

  <form (ngSubmit)="saveTravel()">
    <input type="text" [(ngModel)]="newTravel.destination" name="destination" placeholder="Destination" required class="form-control mb-2">
    <input type="date" [(ngModel)]="newTravel.dateDepart" name="dateDepart" required class="form-control mb-2">
    <input type="date" [(ngModel)]="newTravel.dateRetour" name="dateRetour" required class="form-control mb-2">
    <input type="number" [(ngModel)]="newTravel.prix" name="prix" placeholder="Prix" required class="form-control mb-2">
    <input type="number" [(ngModel)]="newTravel.nombrePlaces" name="nombrePlaces" placeholder="Places" required class="form-control mb-2">
    <textarea [(ngModel)]="newTravel.description" name="description" placeholder="Description" required class="form-control mb-2" rows="4"></textarea>
    
    <!-- Sélecteur de promotion -->
    <select [(ngModel)]="newTravel.promotion" name="promotion" class="form-control mb-2">
      <option [ngValue]="null">Aucune promotion</option>
      <option *ngFor="let promo of promotions" [ngValue]="promo.id">
        {{ promo.nom }} ({{ promo.pourcentage }}%)
      </option>
    </select>

    <input type="file" (change)="onFileSelected($event)" class="form-control mb-2">
    <img *ngIf="imagePreviewUrl" [src]="imagePreviewUrl" alt="Prévisualisation" style="max-height: 150px;" class="mt-2">

    <!-- Message d'erreur -->
    <div *ngIf="errorMessage" class="alert alert-danger mt-2">
      {{ errorMessage }}
    </div>

    <button type="submit" class="btn btn-success mt-3">Enregistrer</button>
  </form>
</div>
